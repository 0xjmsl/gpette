# gpette.toml: every setting in one place. Copy this file to gpette.toml and edit.
# Secrets are NOT here: set ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY in the environment.
# Relative paths are relative to this file's folder.

[daemon]
url = "http://127.0.0.1:3100"        # xmtp_daemon's local API
# nothing_matched = ""               # who answers when no profile matched: "" = nobody | "<profile name>" = that profile, behind its gate.
#                                    # Unset = the default profile below. [inboxes.<name>] may set its own
# nothing_matched_groups = false      # true = that also covers groups no profile lists (else they follow [claude_code] groups)

[server]
host = "127.0.0.1"                   # keep it local: the web UI and /api/config have no login
port = 4849                          # xmtp_daemon's XMTP_WEBHOOK_URL points here
data_dir = "./data"                  # database, logs, uploads
read_receipts = true
timer_check_secs = 60
stack_secs = 5                       # a chat's turn waits until it has been quiet this long, then its
                                     # waiting messages are answered together (profiles may override)
group_reply_secs = 0                 # a bot posts in a group at most once per this many seconds
                                     # (0 = no limit; profiles may override). README section Group chats

[storage]
backend = "sqlite"                   # built in; other backends are plug-ins

[llm]
provider = "claude-code"             # claude-code | claude | openai | gemini | lmstudio | ollama
lmstudio_host = "http://localhost:1234/v1"
ollama_host = "http://localhost:11434"
system_prompt_file = ""              # for API providers; empty = built-in prompt
[llm.models]
claude = "claude-sonnet-4-5"
openai = "gpt-4.1"
gemini = "gemini-flash-lite-latest"
ollama = "qwen3"

[claude_code]
workdir = "./workdir"                # its CLAUDE.md is the bot's personality and rules
allowed_tools = ["Read(./**)", "Glob(./**)", "Grep(./**)"]   # scoped: a bare "Read" can read ANY file the user can
max_turns = 50
timeout_secs = 3600
privacy = true                       # bots never reveal paths, user names, machine or config details (per profile too)
inherit_user_settings = false        # keep false: true loads YOUR personal CLAUDE.md, memory and permissions into the bot
fenced_timeout_secs = 180            # no-tools runs (groups, allowed_tools = []) give up sooner: they can stall
transcripts = false                  # true = write conversations/<person>/ files the bot can search (each run sees only its own)
groups = "sandbox"                   # group chats in no profile: sandbox (empty folder, no tools) | default (the folder and tools above) | none (not answered). [inboxes.<name>] groups = ... sets it for one inbox
group_workdir = "./groups"           # sandbox mode: one empty, tool-less folder per group chat

[sessions]
routing = "per_conversation"         # per_conversation | shared (every DM resumes one session)
                                     # | per_account (one session per person, see owner_resolver)
                                     # | fresh (a new session every turn, started with the
                                     #   summary + latest messages; a profile may set it too)
owner_resolver = ""                  # per_account: a module with owner_for(inbox_id) -> str | None
                                     # (e.g. the account an inbox belongs to); empty = per inbox

[filter]
default = "answer"                   # who this gpette answers when no rule matches: answer | ignore
# Rules are checked in order, before the gate; the first match wins. Use them when two
# gpettes share one inbox (each answers its own people) or to mute someone.
# [[filter.rules]]
# name = "the owner's machine answers these"
# action = "ignore"                  # answer | ignore
# inboxes = ["<inbox id>"]          # a DM sender
# accounts = ["0x<account>"]         # needs [sessions] owner_resolver
# groups = ["<group conversation id>"]   # a group chat, by its id

# a2ui = true on a profile lets it answer with an interface the person's app draws
# (buttons, forms, lists; README: Interfaces the app draws). Needs: pip install a2ui-agent-sdk

[send]                               # [SEND_XMTP_MESSAGE], for profiles with send = true
per_item = 3                         # sends a turn gets for each timer fire or stacked message
max_per_turn = 15                    # never more than this in one turn

[admin_turn]                         # [ADMIN_TURN], for profiles with admin_profile (README: Asking the main)
per_inbox_per_day = 15               # requests one person's chat may raise per day; 0 = no limit
per_day = 50                         # requests one main takes per day; 0 = no limit
copy_words = 6                       # a note sharing this many words in a row with a person's message is a copy; 0 = off
# [admin_turn.inboxes]               # one inbox with its own per-day number
# "<inbox id>" = 0

[gate]
kind = "open"                        # open (answer everyone) | password | none (answer no one) | a plug-in module
password = "password"                # with kind = "password": a stranger's first message must be exactly this
welcome = "You are in. Say hello."   # the reply to the right password
limit_reply = "No more new people today. Please try again tomorrow."
new_people_per_day = 10              # how many new people the password can let in per day
messages_per_person_per_day = 0      # 0 = no cap; applies to every gate

[senders]
resolver = "publicos"                # "publicos" (built-in: the PublicOS display name, public RPC) · a module with resolve(inbox_id, address=None) -> name · "" = short inbox id
# rpc = "https://rpc.publicos.dev"   # the built-in lookup's RPC (default)
# mr_anchor = ""                     # its ModuleRegistry; empty = the PublicOS production chain's

[compaction]
# Every long chat keeps one running summary, so the model reads the summary plus the
# latest messages instead of everything.
# API models: when more than `after` messages follow the summary, all but the latest
# `keep` are folded into it in one call.
provider = "same"                    # same (the chat's own model) | lm_studio | claude | openai | gemini | ollama | disabled
after = 30
keep = 10                            # the latest messages kept word for word (both kinds of chat)

# Claude Code chats: the trigger is the size of the session, read after each run. From
# `topic_tokens` on, each new message is checked with one short call: a new subject cuts.
# From `force_tokens` on, the next message cuts. A cut folds the chat log into the summary
# (one call) and drops the session; the next session starts with the summary and the
# latest `keep` messages. With provider = "same" the two calls are one-shot `claude` runs
# on `model`, with no session and no tools. Keep both sizes under the context window of
# the chat's model; 0 turns that trigger off. `/compact` cuts at any size.
[compaction.claude_code]
model = "sonnet"
topic_tokens = 300000
force_tokens = 400000
summary_words = 1000

# Plug-ins (a gate, a storage backend, a sender resolver) read their own settings from
# [plugins.<name>], with config.plugin_settings("<name>"). The plug-in documents its keys.
# [plugins.my_gate]
# allow_list = "./allowed.txt"

# ---------------------------------------------------------------------------------------------
# Several inboxes (optional): one xmtp_daemon per inbox, each its own name and picture in chat
# lists. List them here and bind a profile to each with `inbox = "<name>"`. Inbox ids are read
# from each daemon's /health; a reply leaves through the inbox its chat belongs to. Without
# [inboxes], everything goes through [daemon] url. README § Several inboxes.
#
# [inboxes.alice]
# url = "http://127.0.0.1:3111"
#
# [profiles.alice]
# inbox = "alice"                    # answers what arrives at alice (members optional), speaks as alice

# ---------------------------------------------------------------------------------------------
# Profiles: give some people or groups their own environment. A message is matched by its
# group chat id first, then by the sender's inbox id; anything unmatched uses the settings above.
# Every key is optional; missing keys fall back to the sections above.
# Keys: members, inbox (one of [inboxes]), stack_secs, group_reply_secs, provider, model, workdir, allowed_tools ([] = no tools), system_prompt or
# system_prompt_file (appended for Claude Code; the system prompt for API providers),
# sessions (per_conversation | shared), gate, tools (Python tools for API providers),
# max_turns, timeout_secs, privacy, inherit_user_settings, admin, on_error (describe | generic), error_reply. A group chat in no profile runs in its own empty folder under
# [claude_code] group_workdir with no tools.
#
# [profiles.me]
# members = ["<your inbox id>", "<a group conversation id>"]
# provider = "claude-code"
# workdir = "./profiles/me"           # its own CLAUDE.md
# allowed_tools = ["Read", "Glob", "Grep", "Bash", "Edit", "Write"]
#                                     # or ["*"]: every tool, permissions from the settings
#                                     # files (owner-only; pairs with inherit_user_settings);
#                                     # ["*", "Bash", "Edit"]: every tool, and those two approved outright
# sessions = "shared"
# gate = "open"
# menu = true                        # /menu (model, timers, session, status) + errors in full
# admin = true                       # other profiles may wake this one with [ADMIN_TURN]; grants nothing else
# admin_turns_per_day = 50           # this main's own daily total (default: [admin_turn] per_day)
# admin_profile = "me"               # on another profile: the profile its [ADMIN_TURN] wakes
# send = true                        # may write to other inboxes and registered groups with [SEND_XMTP_MESSAGE] (README: Writing first)
# public_profile = "public"          # who answers the people this profile writes to first (README: public profiles)
#
# [profiles.public]                  # a public profile: no members, people arrive through the inbox list or nothing_matched
# workdir = "./public"               # with per_inbox: the parent of one folder per person; its CLAUDE.md is shared
# per_inbox = true
# allowed_tools = ["Read", "Glob", "Grep"]
# knowledge = "./knowledge"          # a folder every run of this profile may also read
# admin_profile = "me"               # the profile its [ADMIN_TURN] wakes
# admin_inbox = "<owner inbox id>"  # ...and for which inbox: woken in its DM with this one (a member of "me")
# admin_turns_per_inbox_per_day = 15 # its own per-person number (default: [admin_turn] per_inbox_per_day)
#
# [profiles.friends]
# members = ["<inbox id>", "<group id>"]
# provider = "lmstudio"
# system_prompt_file = "./profiles/friends/prompt.txt"
# tools = ["setTimer", "listTimers"]   # Python tools from ./tools this profile may call
# error_reply = "Not available right now, back soon."   # what they see if the model fails
