<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpette admin</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#d7dde5; --dim:#8b95a3; --ok:#3fb950; --no:#f0883e; --warn:#d29922; --acc:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header .dim { color:var(--dim); font-size:12px; }
  main { padding:16px 20px; display:grid; gap:16px; grid-template-columns: 1fr; max-width:1400px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; border-top:none; }
  code, .mono { font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .allow { color:var(--ok); border-color:#23502c; } .reject, .ignore { color:var(--no); border-color:#5a3418; }
  .auth { color:var(--warn); border-color:#5a4a18; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input, select, button { background:#0b0e13; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input { min-width: 260px; } button { cursor:pointer; color:var(--acc); }
  pre { margin:8px 0 0; white-space:pre-wrap; word-break:break-all; font-size:12px; color:var(--text); }
  .short { max-width: 14ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:bottom; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>gpette admin</h1>
  <span class="dim">where each conversation goes · read-only · this machine only</span>
  <span class="dim" id="stamp"></span>
</header>
<main>
  <section>
    <h2>Conversations (last message each)</h2>
    <table id="routes"><thead><tr>
      <th>When</th><th>Kind</th><th>Conversation</th><th>Sender</th><th>Profile</th><th>Session</th><th>Decision</th><th>Msgs</th>
    </tr></thead><tbody></tbody></table>
  </section>
  <div class="grid2">
    <section>
      <h2>Who would handle…</h2>
      <form id="explain">
        <input name="sender" placeholder="sender inbox id">
        <input name="conversation" placeholder="conversation id (optional for a DM)">
        <select name="kind"><option>dm</option><option>group</option></select>
        <button>Explain</button>
      </form>
      <pre id="explained"></pre>
    </section>
    <section>
      <h2>Setup</h2>
      <pre id="setup"></pre>
    </section>
  </div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = s => s ? `<span class="short mono" title="${esc(s)}">${esc(s)}</span>` : '<span class="dim">·</span>';
function pill(decision) {
  const d = String(decision || '');
  const cls = /ignore/.test(d) ? 'ignore' : /reject/.test(d) ? 'reject' : /auth_/.test(d) ? 'auth' : 'allow';
  return `<span class="pill ${cls}">${esc(d)}</span>`;
}
async function load() {
  const r = await fetch('/api/admin/routes').then(r => r.json());
  const tb = document.querySelector('#routes tbody');
  tb.innerHTML = r.routes.map(x => `<tr>
    <td class="mono">${new Date(x.at * 1000).toLocaleString()}</td>
    <td>${esc(x.kind)}</td>
    <td>${short(x.conversation_id)}</td>
    <td>${x.sender_name ? esc(x.sender_name) + ' ' : ''}${short(x.sender)}</td>
    <td>${esc(x.profile ?? '—')}</td>
    <td>${short(x.session_key)}</td>
    <td>${pill(x.decision)}</td>
    <td>${x.count ?? ''}</td></tr>`).join('') || '<tr><td colspan="8" class="dim">nothing yet</td></tr>';
  document.getElementById('stamp').textContent = 'updated ' + new Date().toLocaleTimeString();
}
async function setup() {
  const s = await fetch('/api/admin/setup').then(r => r.json());
  document.getElementById('setup').textContent = JSON.stringify(s, null, 2);
}
document.getElementById('explain').addEventListener('submit', async e => {
  e.preventDefault();
  const q = new URLSearchParams(new FormData(e.target));
  const r = await fetch('/api/admin/explain?' + q).then(r => r.json());
  document.getElementById('explained').textContent = JSON.stringify(r, null, 2);
});
load(); setup(); setInterval(load, 10000);
</script>
</body>
</html>
